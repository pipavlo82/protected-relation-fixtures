name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_manifest.py
      - run: python tools/validate_seed_corpus.py
      - name: Validate relation-discrimination policy separation
        run: python tools/validate_relation_discrimination.py
      - run: python -m unittest discover -s tests -v
      - name: Prove optimized mode cannot disable contract checks
        run: python -O -m unittest discover -s tests -v

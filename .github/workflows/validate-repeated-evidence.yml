name: validate repeated external-evaluator evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repeated-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_external_evaluator_repeated_evidence.py
      - run: python -m unittest tests.test_external_evaluator_repeated_evidence -v
      - run: python -O -m unittest tests.test_external_evaluator_repeated_evidence -v

name: external-evaluator-first-run-evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove frozen v0 remains unchanged
        run: python tools/validate_v0_freeze.py
      - name: Validate external evaluator evidence bytes and derived matrix
        run: python tools/validate_external_evaluator_evidence.py
      - name: Run evidence mutation controls
        run: python -m unittest tests.test_external_evaluator_evidence -v
      - name: Prove optimized mode cannot disable evidence checks
        run: python -O -m unittest tests.test_external_evaluator_evidence -v

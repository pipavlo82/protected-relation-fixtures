name: external-adapter-contract-v0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove frozen v0 remains unchanged
        run: python tools/validate_v0_freeze.py
      - name: Validate external adapter contract and oracle isolation
        run: python -m unittest tests.test_external_adapter_contract -v
      - name: Validate external adapter contract under optimized Python
        run: python -O -m unittest tests.test_external_adapter_contract -v
